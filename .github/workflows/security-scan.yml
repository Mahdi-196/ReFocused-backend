name: Security Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays at midnight

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Bandit (Python Security Scanner)
      run: |
        bandit -r app/ -f json -o bandit-results.json || true
        
    - name: Run Safety (Dependency Scanner)
      run: |
        safety check -r requirements.txt --json > safety-results.json || true
        
    - name: Upload Security Scan Results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan-results
        path: |
          bandit-results.json
          safety-results.json
          
    - name: Check for Critical Vulnerabilities
      run: |
        if grep -q '"issue_severity": "HIGH"' bandit-results.json; then
          echo "Critical security issues found in code!"
          exit 1
        fi 